# Backend CI. GitHub only reads workflows from the repository root (.github/workflows);
# if this backend folder is not the repository root, move this file to the root's .github/workflows/.
name: backend-ci

on:
  push:
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Integration tests start PostgreSQL with Testcontainers, so Docker must be available (it is on ubuntu-latest).
      - name: Compile and run all tests
        run: ./mvnw -B verify

      - name: Build container image
        run: docker build -t mr-biryani-backend:${{ github.sha }} .

      - name: Scan dependencies for known vulnerabilities
        run: ./mvnw -B -DskipTests org.owasp:dependency-check-maven:check || echo "Dependency scan reported findings; review the report"
        continue-on-error: true
